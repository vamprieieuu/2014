name: Build 2014 After Effects Plug-in (Windows x64)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Supplied Adobe After Effects SDK Layout
        shell: pwsh
        run: |
          $sdkRoot = "extern/AfterEffectsSDK/Examples"
          if (-not (Test-Path $sdkRoot)) {
            if (Test-Path "extern/AfterEffectsSDK/Headers") {
              $sdkRoot = "extern/AfterEffectsSDK"
            } else {
              Write-Error "FATAL: extern/AfterEffectsSDK/Examples does not exist."
              exit 1
            }
          }

          $headersDir   = Join-Path $sdkRoot "Headers"
          $resourcesDir = Join-Path $sdkRoot "Resources"
          $utilDir      = Join-Path $sdkRoot "Util"
          $gpuUtilsDir  = Join-Path $sdkRoot "GPUUtils"
          $aeEffectH    = Join-Path $headersDir "AE_Effect.h"
          $piplTool     = Join-Path $resourcesDir "PiPLtool.exe"

          Write-Host "=== Adobe After Effects SDK Paths ==="
          Write-Host "SDK Root:      $sdkRoot"
          Write-Host "Headers:       $headersDir"
          Write-Host "Resources:     $resourcesDir"
          Write-Host "Util:          $utilDir"
          Write-Host "GPUUtils:      $gpuUtilsDir"
          Write-Host "AE_Effect.h:   $aeEffectH"
          Write-Host "PiPLtool.exe:  $piplTool"

          if (-not (Test-Path $aeEffectH)) {
            Write-Error "FATAL: Missing $aeEffectH"
            exit 1
          }
          if (-not (Test-Path $piplTool)) {
            Write-Error "FATAL: Missing $piplTool"
            exit 1
          }

      - name: Configure CMake (Visual Studio 17 2022 x64)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build Release x64 (2014_core, 2014_tests, 2014_aex)
        run: cmake --build build --config Release --target 2014_core 2014_tests 2014_aex

      - name: Run Automated Engine Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate 2014.aex PE x64 Binary, PiPL & Exports
        shell: pwsh
        run: |
          $aex = Get-ChildItem -Path "build" -Filter "2014.aex" -Recurse | Select-Object -First 1
          if (-not $aex) {
            Write-Error "FATAL: 2014.aex was NOT produced by the build!"
            exit 1
          }

          $piplRc = Join-Path "build" "2014_PiPL.rc"
          if (-not (Test-Path $piplRc)) {
            Write-Error "FATAL: PiPL resource file 2014_PiPL.rc was not generated!"
            exit 1
          }

          Write-Host "=== 2014.aex Build Verification ==="
          Write-Host "Exact Path: $($aex.FullName)"
          Write-Host "File Size:  $($aex.Length) bytes"
          Write-Host "PiPL RC:    $piplRc ($((Get-Item $piplRc).Length) bytes)"

          # Verify MZ / PE signature and x64 machine type (0x8664) directly from bytes
          $bytes = [System.IO.File]::ReadAllBytes($aex.FullName)
          if ($bytes.Length -lt 4096 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            Write-Error "FATAL: 2014.aex is not a valid Windows PE binary (missing MZ header)."
            exit 1
          }
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          $machine  = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) {
            Write-Error ("FATAL: 2014.aex machine type is 0x{0:X4}, expected 0x8664 (x64)." -f $machine)
            exit 1
          }
          Write-Host "PE Architecture Verified: Windows PE x64 (0x8664)"

          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vsWhere) {
            $vcToolsDir = & $vsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            $dumpbin = Get-ChildItem -Path "$vcToolsDir\VC\Tools\MSVC" -Filter "dumpbin.exe" -Recurse | Where-Object { $_.FullName -match "Hostx64\\x64" } | Select-Object -First 1
            if ($dumpbin) {
              $exports = & $dumpbin.FullName /exports $aex.FullName | Out-String
              Write-Host $exports
              if (-not ($exports -match "EffectMain")) {
                Write-Error "FATAL: EffectMain is not exported by 2014.aex!"
                exit 1
              }

              $deps = & $dumpbin.FullName /dependents $aex.FullName | Out-String
              Write-Host $deps
              if ($deps -match "MSVCP140D\.dll|VCRUNTIME140D\.dll|ucrtbased\.dll") {
                Write-Error "FATAL: Debug CRT dependency found in Release 2014.aex!"
                exit 1
              }
            }
          }

          New-Item -ItemType Directory -Force -Path "artifact_staging" | Out-Null
          Copy-Item $aex.FullName -Destination "artifact_staging/2014.aex"

      - name: Upload 2014-aex-windows-x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2014-aex-windows-x64
          path: artifact_staging/2014.aex
          if-no-files-found: error
